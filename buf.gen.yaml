version: v2
plugins:
  - local: [go, tool, protoc-gen-go]
    out: .
    opt: module=github.com/tunedev/atlas
  - local: [go, tool, protoc-gen-connect-go]
    out: .
    opt: [module=github.com/tunedev/atlas, package_suffix]
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/src/gen
    opt: target=ts
