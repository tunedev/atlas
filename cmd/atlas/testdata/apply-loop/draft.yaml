# Stands in for packs/tailor.yaml in the apply-loop test: it takes the vars
# the loop passes to the real pack and only declares the drafted stage, so
# the loop runs with no model and no typst.
name: draft-stand-in
vars:
  subject_id: ""
  url: ""
  posting: ""
  store_root: ""
  out_dir: ""
  templates: ""
  declared_by: ""

steps:
  - id: drafted
    tool: stage.declare
    with:
      subject_id: "{{ .vars.subject_id }}"
      stage: drafted
      declared_by: "{{ .vars.declared_by }}"
