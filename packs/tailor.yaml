# Tailors application documents to one posting from the record. Every
# statement about the candidate cites spans of the candidate's own text.
# Which requirements exist comes from the posting alone (the asked step), and
# which questions exist from the questions var alone, one per line, so a
# requirement or question the record cannot support becomes a gap instead of
# vanishing. Writes four PDFs to out_dir: cv.pdf and letter.pdf carry only
# supported content; review.pdf lists every gap and dropped count;
# instructions.pdf says where to submit (url), which file goes where, each
# answer to paste, and the sent.yaml command to run once sent. Only then is
# the drafted stage declared. Nothing is submitted.
# Rendering needs ATLAS_RENDER_TYPST (or -render-typst) set to a typst binary.
#   ATLAS_RENDER_TYPST=typst atlas -pack packs/tailor.yaml \
#     -var store_root="$HOME/.atlas/workspace" -var subject_id=acme-backend \
#     -var out_dir="$HOME/applications/acme" -var posting="$(cat posting.txt)" \
#     -var questions="$(cat questions.txt)"
name: tailor
vars:
  store_root: ""
  evidence_dir: ""
  posting: ""
  questions: ""
  subject_id: ""
  url: ""
  out_dir: ""
  declared_by: tailor
  templates: "packs/tailor"
  relevance_threshold: "0.6"
  min_chars: "25"

steps:
  - id: spans
    tool: text.spans
    with:
      paths: |
        {{ .vars.store_root }}/profile/source.txt
        {{ if .vars.evidence_dir }}{{ .vars.evidence_dir }}{{ end }}
      min_chars: "{{ .vars.min_chars }}"

  - id: history
    tool: file.read
    with:
      path: "{{ .vars.store_root }}/profile/history.json"

  - id: asked
    tool: extract.run
    with:
      text: |
        Task: list every requirement the posting states, each as a verbatim quote copied from
        the posting.

        Posting:
        {{ .vars.posting }}
      schema: |
        {"type":"object","required":["requirements"],"additionalProperties":false,
         "properties":{"requirements":{"type":"array","items":{"type":"object",
           "required":["quote"],"additionalProperties":false,
           "properties":{"quote":{"type":"string"}}}}}}

  - id: asked_ground
    tool: quote.ground
    with:
      fields: "{{ json .steps.asked.fields }}"
      source: "{{ .vars.posting }}"

  - id: requirements
    tool: extract.run
    with:
      text: |
        Task: for each numbered requirement below, cite the numbers of the candidate's evidence
        spans that directly show the candidate meets it. Cite nothing if no span shows it. Never
        guess. Name every requirement's number exactly once, even when its spans list is empty.

        Candidate's evidence spans:
        {{ .steps.spans.listing }}
        Requirements:
        {{ range $i, $r := .steps.asked_ground.fields.requirements }}[{{ $i }}] {{ $r.quote }}
        {{ end }}
      schema: |
        {"type":"object","required":["cited"],"additionalProperties":false,
         "properties":{"cited":{"type":"array","items":{"type":"object",
           "required":["item","spans"],"additionalProperties":false,
           "properties":{"item":{"type":"integer"},"spans":{"type":"array","items":{"type":"integer"}}}}}}}

  - id: cite_items
    tool: items.cite
    with:
      items: "{{ json .steps.asked_ground.fields.requirements }}"
      cited: "{{ json .steps.requirements.fields.cited }}"

  - id: bullets
    tool: extract.run
    with:
      text: |
        Task: choose at most 8 of the candidate's evidence spans that best fit this posting,
        most relevant first. Cite each by its number only.

        Candidate's evidence spans:
        {{ .steps.spans.listing }}
        Posting:
        {{ .vars.posting }}
      schema: |
        {"type":"object","required":["bullets"],"additionalProperties":false,
         "properties":{"bullets":{"type":"array","maxItems":8,"items":{"type":"object",
           "required":["spans"],"additionalProperties":false,
           "properties":{"spans":{"type":"array","minItems":1,"maxItems":1,"items":{"type":"integer"}}}}}}}

  - id: questions
    tool: text.lines
    with:
      text: "{{ .vars.questions }}"

  - id: letter
    tool: extract.run
    with:
      text: |
        Task: write a short letter of application of about six sentences. Every sentence about
        the candidate must cite the numbers of the evidence spans that support it. Do not write
        a sentence the spans do not support.
        {{ if .steps.questions.items }}Also answer each numbered question below in one to three sentences,
        citing spans the same way. Name every question's number exactly once in answered, with an
        empty sentences list when no span supports an answer.{{ else }}No questions are asked.
        Return an empty answered list.{{ end }}

        Candidate's evidence spans:
        {{ .steps.spans.listing }}
        Posting:
        {{ .vars.posting }}
        {{ if .steps.questions.items }}Questions:
        {{ range $i, $q := .steps.questions.items }}[{{ $i }}] {{ $q.quote }}
        {{ end }}{{ end }}
      schema: |
        {"type":"object","required":["letter","answered"],"additionalProperties":false,
         "properties":{
          "letter":{"type":"array","items":{"type":"object","required":["text","spans"],"additionalProperties":false,
            "properties":{"text":{"type":"string"},"spans":{"type":"array","items":{"type":"integer"}}}}},
          "answered":{"type":"array","items":{"type":"object","required":["item","sentences"],"additionalProperties":false,
            "properties":{"item":{"type":"integer"},"sentences":{"type":"array","items":{"type":"object",
              "required":["text","spans"],"additionalProperties":false,
              "properties":{"text":{"type":"string"},"spans":{"type":"array","items":{"type":"integer"}}}}}}}}}}

  - id: answers
    tool: items.gather
    with:
      items: "{{ json .steps.questions.items }}"
      answered: "{{ json .steps.letter.fields.answered }}"

  - id: resolve
    tool: span.resolve
    with:
      fields: |
        {"requirements": {{ json .steps.cite_items.items }},
         "bullets": {{ json .steps.bullets.fields.bullets }},
         "letter": {"sentences": {{ json .steps.letter.fields.letter }},
                    "answers": {{ json .steps.answers.items }}}}
      spans: "{{ json .steps.spans.spans }}"

  - id: ground
    tool: quote.ground
    with:
      fields: "{{ json .steps.resolve.fields }}"
      source: "{{ .steps.spans.source }}"

  - id: judge
    tool: citations.judge
    with:
      fields: "{{ json .steps.ground.fields }}"
      threshold: "{{ .vars.relevance_threshold }}"
      subject_id: "{{ .vars.subject_id }}"

  - id: settle
    tool: claims.settle
    with:
      fields: "{{ json .steps.judge.fields }}"

  - id: save
    tool: docs.put
    with:
      path: "applications/{{ .vars.subject_id }}/tailored.json"
      body: "{{ json .steps.settle.fields }}"
      kind: tailored
      expect: json
      message: "Tailor for {{ .vars.subject_id }}"
      fields: |
        gaps: "{{ .steps.settle.gaps }}"
        dropped_requirements: "{{ .steps.cite_items.dropped }}"

  # cv.pdf and letter.pdf are sendable: they carry only kept content, and a
  # render fails if any gap text reaches them. review.pdf lists every gap.
  - id: cv
    tool: render.run
    with:
      template: "{{ .vars.templates }}/cv.typ"
      data: '{"history": {{ .steps.history.body }}, "tailored": {{ json .steps.settle.fields }}}'
      output: "{{ .vars.out_dir }}/cv.pdf"
      expect: "{{ json .steps.settle.kept.bullets }}"
      absent: "{{ json .steps.settle.gaps_text.requirements }}"

  - id: letter_pdf
    tool: render.run
    with:
      template: "{{ .vars.templates }}/letter.typ"
      data: '{"tailored": {{ json .steps.settle.fields }}}'
      output: "{{ .vars.out_dir }}/letter.pdf"
      expect: "{{ json .steps.settle.kept.letter }}"
      absent: "{{ json .steps.settle.gaps_text.letter }}"

  - id: review
    tool: render.run
    with:
      template: "{{ .vars.templates }}/review.typ"
      data: |
        {"tailored": {{ json .steps.settle.fields }},
         "dropped": {"requirements": {{ .steps.cite_items.dropped }}}}
      output: "{{ .vars.out_dir }}/review.pdf"
      expect: "{{ json .steps.settle.gaps_all }}"

  - id: instructions
    tool: render.run
    with:
      template: "{{ .vars.templates }}/instructions.typ"
      data: |
        {"url": {{ json .vars.url }},
         "subject_id": {{ json .vars.subject_id }},
         "files": ["cv.pdf", "letter.pdf"],
         "answers": {{ json .steps.settle.fields.letter.answers }},
         "gaps": {{ json .steps.settle.gaps_all }}}
      output: "{{ .vars.out_dir }}/instructions.pdf"
      expect: '{{ if .vars.url }}[{{ json .vars.url }}]{{ else }}[]{{ end }}'

  - id: drafted
    tool: stage.declare
    with:
      subject_id: "{{ .vars.subject_id }}"
      stage: drafted
      declared_by: "{{ .vars.declared_by }}"
