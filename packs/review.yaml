# Reads one subject's latest judgement: its index row, the recorded
# document, and the verdict, reasons and tripped rules re-assessed from it.
# question is the id of the question whose answer is the verdict. A subject
# with no judgement fails at the doc step.
#   atlas -pack packs/review.yaml -var subject_id=greenhouse~gitlab~12345
name: review
vars:
  subject_id: ""
  question: verdict

steps:
  - id: judgement
    tool: index.find
    with:
      kind: judgement
      match: "subject_id: {{ json .vars.subject_id }}"
      limit: "1"

  - id: doc
    tool: docs.get
    with:
      path: "{{ (index .steps.judgement.rows 0).path }}"

  - id: assessment
    tool: judge.assess
    with:
      path: "{{ .steps.doc.path }}"
      verdict: "{{ .vars.question }}"
