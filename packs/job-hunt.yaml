# Scores every open role on one board against the candidate. Each role gets
# apply, reach or skip, reasons from the same call, and every deal-breaker
# named as tripped, clear or unknown. A role already judged with the same
# text, questions, rules and model is reused, not asked again.
#
# The deal-breaker named in the profile text above is only informed context
# for the model; it is checked as a rule, and reported tripped, clear or
# unknown, only when -var rules=profile/dealbreakers.json is passed.
#
# Then the policy decides each role (-var policy=profile/policy.json; with
# none, every role not denied by a tripped deal-breaker is asked). Allowed
# roles with no stage yet are drafted by tailor.yaml, one at a time, into
# out_dir/<subject_id>; denied roles with no stage yet are skipped by
# skip.yaml. Nothing is ever submitted, and a second run redrafts and
# re-skips nothing. Asked roles are the decide step's rows with decision:
# ask; run tailor.yaml or skip.yaml on them by hand.
#   ATLAS_RENDER_TYPST=typst atlas -pack packs/job-hunt.yaml -var board=gitlab \
#     -var rules=profile/dealbreakers.json -var policy=profile/policy.json \
#     -var store_root="$HOME/.atlas/workspace" -var out_dir="$HOME/applications"
name: job-hunt
vars:
  board: gitlab
  policy: ""
  store_root: ""
  out_dir: ""
  templates: packs/tailor
  profile: "Backend engineer. Go, distributed systems, Kubernetes, Postgres, OpenTelemetry. Goals: senior backend role, systems with real scale, staying hands-on. Deal-breakers: no on-call or pager rotation."
  rules: ""

steps:
  - id: board
    tool: judge.each
    with:
      prefix: "postings/greenhouse/{{ .vars.board }}"
      match: status=open
      subject_id: '[[ replace .item.id "/" ":" ]]'
      subject: |
        Candidate: {{ .vars.profile }}

        Role: [[ .item.title ]] at [[ .item.company ]]

        [[ .item.description_text ]]
      verdict: verdict
      questions: |
        - id: verdict
          type: choice
          options: [apply, reach, skip]
          ask: Should the candidate apply, treat it as a reach, or skip it?
        - id: seniority
          type: score
          levels: [junior, mid, senior, principal]
          ask: How senior is this role?
        - id: focus
          type: choice
          options: [backend, frontend, platform, data, other]
          ask: What is the main focus of this role?
      rules: "{{ .vars.rules }}"
      rule_fields: |
        salary-floor: compensation.min

  - id: decide
    tool: policy.decide
    with:
      rows: "{{ json .steps.board.rows }}"
      policy: "{{ .vars.policy }}"

  - id: attach
    tool: stage.attach
    with:
      rows: "{{ json .steps.decide.rows }}"

  - id: draft
    tool: pack.each
    with:
      pack: packs/tailor.yaml
      rows: "{{ json .steps.attach.rows }}"
      match: decision=allow,stage=
      vars: |
        subject_id: '[[ .item.subject_id ]]'
        url: '[[ .item.item.url ]]'
        posting: |
          [[ .item.item.title ]] at [[ .item.item.company ]]

          [[ .item.item.description_text ]]
        store_root: {{ json .vars.store_root }}
        out_dir: {{ json (printf "%s/[[ .item.subject_id ]]" .vars.out_dir) }}
        templates: {{ json .vars.templates }}
        declared_by: job-hunt

  - id: skip
    tool: pack.each
    with:
      pack: packs/skip.yaml
      rows: "{{ json .steps.attach.rows }}"
      match: decision=deny,stage=
      vars: |
        subject_id: '[[ .item.subject_id ]]'
        reason: '[[ .item.because ]]'
        judgement_path: '[[ .item.judgement_path ]]'
        choice: policy_skip
        declared_by: job-hunt
